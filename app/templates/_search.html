{% macro search_box(q="", big=False, autofocus=False) %}
<form class="search {{ 'search--big' if big }}" action="/search" method="get" role="search" autocomplete="off">
  <svg class="search__icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
  <input data-q type="search" name="q" value="{{ q }}" placeholder="عبارت جستجو را بنویسید…" aria-label="جستجو" spellcheck="false" {{ 'autofocus' if autofocus }}>
  <button type="submit">جستجو</button>
  <ul id="suggest" class="suggest" role="listbox" hidden></ul>
</form>
{% endmacro %}
